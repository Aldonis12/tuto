<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="form-container">
      <div class="form-header">
        <h1 id="form-title">Connexion</h1>
      </div>

      <div id="login-form" class="form active">
        <form>
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Entrez votre email" required>
                </div>
            </div>
          <div class="input-group">
            <label for="password">Mot de passe</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
            </div>
          </div>
          <div class="options">
            <label class="remember-me">
              <input type="checkbox"> Se souvenir de moi
            </label>
            <a href="#" id="forget-password-link">Mot de passe oublié ?</a>
          </div>
          <button type="submit" class="btn">Se connecter</button>
          <p class="switch-form">Pas encore inscrit ? <a href="#" id="register-link">Créer un compte</a></p>
        </form>
      </div>

      <div id="register-form" class="form">
        <form>
            <div class="input-group">
                <label for="name">Nom</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" placeholder="Entrez votre nom" required>
                </div>
            </div>
            <div class="input-group">
                <label for="surname">Prenom</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="surname" placeholder="Entrez votre prenom" required>
                </div>
            </div>
            <div class="input-group">
                <label for="email-register">Email</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email-register" placeholder="Entrez votre email" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password-register">Mot de passe</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password-register" placeholder="Entrez un mot de passe" required>
                </div>
                <small id="password-error" class="error-message"></small>
            </div>
            <div class="input-group">
                <label for="confirm-password-register">Confirmer le mot de passe</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirm-password-register" placeholder="Confirmez votre mot de passe" required>
                </div>
                <small id="confirm-password-error" class="error-message"></small>
            </div>
          <button type="submit" class="btn">S'inscrire</button>
          <p class="switch-form">Déjà inscrit ? <a href="#" id="login-link">Se connecter</a></p>
        </form>
      </div>

      <div id="forgot-password-form" class="form">
        <form>
            <div class="input-group">
                <label for="email-forgot">Email</label>
                <div class="input-with-icon">
                  <i class="fas fa-envelope"></i>
                  <input type="email" id="email-forgot" placeholder="Entrez votre email pour réinitialiser" required>
                </div>
            </div>
          <button type="submit" class="btn">Réinitialiser</button>
          <p class="switch-form"><a href="#" id="back-to-login">Retour à la connexion</a></p>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
